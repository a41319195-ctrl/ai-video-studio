<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Audio Library Modal Styles */
        .audio-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }
        .audio-modal-overlay.active {
            display: flex;
        }
        .audio-modal {
            background: #1e293b;
            border-radius: 16px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 700px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .audio-modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
        }
        .audio-modal-header h3 {
            color: #38bdf8;
            font-size: 16px;
            margin: 0;
        }
        .audio-modal-header .badge {
            background: #3b82f6;
            color: white;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 10px;
            margin-left: 8px;
        }
        .audio-modal-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 24px;
            cursor: pointer;
            padding: 0 4px;
        }
        .audio-modal-close:hover {
            color: #f8fafc;
        }
        .audio-modal-body {
            padding: 16px 20px;
            overflow-y: auto;
            flex: 1;
        }
        .audio-modal-body::-webkit-scrollbar {
            width: 4px;
        }
        .audio-modal-body::-webkit-scrollbar-track {
            background: #0f172a;
        }
        .audio-modal-body::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        .audio-search-input {
            width: 100%;
            padding: 10px 14px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .audio-search-input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .audio-grid-modal {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .audio-grid-modal::-webkit-scrollbar {
            width: 4px;
        }
        .audio-grid-modal::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        .audio-item-modal {
            background: #0f172a;
            padding: 6px 10px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #334155;
            transition: 0.3s;
            cursor: pointer;
            font-size: 11px;
        }
        .audio-item-modal:hover {
            border-color: #38bdf8;
            background: #1a2a3a;
        }
        .audio-item-modal.selected {
            border-color: #22c55e;
            background: #0a2a1a;
        }
        .audio-item-modal input[type="checkbox"] {
            accent-color: #22c55e;
            width: 14px;
            height: 14px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .audio-item-modal .name {
            color: #f8fafc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            font-size: 11px;
        }
        .audio-item-modal .duration {
            color: #94a3b8;
            font-size: 9px;
            flex-shrink: 0;
        }
        .audio-item-modal .cost-badge {
            font-size: 8px;
            color: #ffcc00;
            background: #0f172a;
            padding: 1px 6px;
            border-radius: 8px;
            flex-shrink: 0;
        }
        .audio-item-modal .play-btn {
            color: #38bdf8;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            padding: 0 2px;
        }
        .audio-item-modal .play-btn:hover {
            color: #22c55e;
        }
        .audio-modal-footer {
            padding: 12px 20px;
            border-top: 1px solid #334155;
            display: flex;
            gap: 10px;
            background: #0f172a;
        }
        .audio-modal-footer .selected-info {
            color: #94a3b8;
            font-size: 12px;
            flex: 1;
            display: flex;
            align-items: center;
        }
        .audio-modal-footer .selected-info span {
            color: #22c55e;
            font-weight: bold;
        }
        .audio-modal-footer button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-apply-audio-modal {
            background: #22c55e;
            color: white;
        }
        .btn-apply-audio-modal:hover {
            background: #16a34a;
        }
        .btn-clear-audio-modal {
            background: #475569;
            color: white;
        }
        .btn-clear-audio-modal:hover {
            background: #334155;
        }
        .btn-open-audio {
            background: #334155;
            color: #f8fafc;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            width: 100%;
            justify-content: center;
        }
        .btn-open-audio:hover {
            background: #475569;
        }
        .btn-open-audio .count {
            background: #3b82f6;
            color: white;
            font-size: 10px;
            padding: 1px 8px;
            border-radius: 10px;
        }

        /* Coin Display Fix */
        #userCoins {
            font-weight: bold;
            color: #ffcc00;
        }

        /* Download Button Fix */
        .download-btn-wrap {
            margin-top: 10px;
            display: none;
            width: 100%;
        }
        .download-btn-wrap.show {
            display: block;
        }
        .download-btn-wrap a {
            display: block;
            width: 100%;
            text-align: center;
            padding: 12px;
            background: #22c55e;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: 0.3s;
        }
        .download-btn-wrap a:hover {
            background: #16a34a;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .audio-grid-modal {
                grid-template-columns: 1fr;
            }
            .audio-modal {
                max-height: 90vh;
            }
        }
        @media (min-width: 601px) and (max-width: 900px) {
            .audio-grid-modal {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (min-width: 901px) {
            .audio-grid-modal {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="studio-container">
        <!-- Navbar -->
        <nav class="navbar">
            <button id="menuBtn" class="icon-btn">☰</button>
            <div class="logo">🎬 AI Studio</div>
            <div id="authSection">
                <button id="googleLoginBtn" class="btn-primary" style="padding: 6px 12px; font-size: 13px;">🔑 Login</button>
                <div id="userProfile" style="display: none; align-items: center; gap: 8px;">
                    <span id="userName" style="font-size: 13px; font-weight: bold; color: #f8fafc;"></span>
                    <button id="logoutBtn" class="btn-secondary" style="padding: 4px 10px; font-size: 12px;">Logout</button>
                </div>
            </div>
        </nav>

        <!-- Sidebar -->
        <div id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h3>📋 Menu</h3>
                <button id="closeMenu" class="icon-btn">✕</button>
            </div>
            <ul class="sidebar-links">
                <li><a href="#" class="active">🏠 Studio</a></li>
                <li><a href="admin.html">👑 Admin</a></li>
                <li><a href="#" id="buyCoinsMenuLink">💳 Buy Coins</a></li>
                <li><a href="#">📁 My Videos</a></li>
            </ul>
        </div>

        <!-- Header -->
        <header class="studio-header">
            <h1>✨ AI Video Studio</h1>
            <p>Text-to-Video • Music • Lip-Sync • Realistic</p>
            <div id="coinBalanceBox">
                🪙 Coins: <span id="userCoins">0</span>
            </div>
        </header>

        <!-- Workspace -->
        <main class="workspace">
            <!-- Input Section -->
            <section class="input-section">
                <div class="input-group">
                    <label for="prompt">📝 Describe your video:</label>
                    <textarea id="prompt" placeholder="e.g., A happy dog dancing in the rain..."></textarea>
                </div>

                <div class="controls-row">
                    <div class="file-upload">
                        <label for="imageUpload" class="btn-secondary" style="width: 100%; cursor: pointer; text-align: center;">📁 Upload</label>
                        <input type="file" id="imageUpload" accept="image/*" hidden>
                    </div>
                    <button id="micBtn" class="btn-secondary">🎙️ Voice</button>
                </div>

                <div class="options-row">
                    <div class="select-group">
                        <label for="resolution">Quality:</label>
                        <select id="resolution">
                            <option value="720p">HD</option>
                            <option value="1080p" selected>Full HD</option>
                            <option value="4k">4K</option>
                        </select>
                    </div>
                    <div class="select-group">
                        <label for="videoDuration">Duration:</label>
                        <select id="videoDuration">
                            <option value="30">30s - 20 Coins</option>
                            <option value="120">1-2min - 50 Coins</option>
                            <option value="300">5min - 100 Coins</option>
                        </select>
                    </div>
                </div>

                <div class="video-cost-display">
                    ⚡ Cost: <span id="videoCostDisplay">20</span> Coins
                </div>

                <button id="generateBtn" class="btn-primary">🚀 Generate Video</button>

                <!-- Audio Library Button -->
                <button class="btn-open-audio" id="openAudioBtn">
                    🎵 Audio Library <span class="count" id="audioCountBadge">0</span>
                </button>
            </section>

            <!-- Preview Section -->
            <section class="preview-section">
                <div class="video-preview-box" id="previewBox">
                    <p id="previewText">🎬 Your video will appear here...</p>
                    
                    <div id="videoPlayerContainer" style="display: none; width: 100%;">
                        <video id="finalVideoPlayer" controls style="width:100%; max-height:250px; background:#000; border-radius:8px;">
                            <source src="" type="video/mp4">
                        </video>
                        <div class="download-btn-wrap" id="downloadBtnWrap">
                            <a id="downloadVideoBtn">📥 Download Video</a>
                        </div>
                    </div>

                    <div class="tts-indicator" id="ttsIndicator" style="display:none; background:#0f172a; padding:8px 12px; border-radius:6px; border:1px solid #334155; font-size:12px; color:#94a3b8; width:100%;">
                        🎤 Lip-Sync: <span style="color:#22c55e; font-weight:bold;">Active</span>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Audio Library Modal -->
    <div class="audio-modal-overlay" id="audioModal">
        <div class="audio-modal">
            <div class="audio-modal-header">
                <h3>🎵 Audio Library <span class="badge">500+</span></h3>
                <button class="audio-modal-close" id="closeAudioModal">✕</button>
            </div>
            <div class="audio-modal-body">
                <input type="text" class="audio-search-input" id="audioSearchModal" placeholder="🔍 Search tracks...">
                <div class="audio-grid-modal" id="audioGridModal">
                    <div style="text-align:center; color:#94a3b8; font-size:13px; padding:20px; grid-column:1/-1;">Loading...</div>
                </div>
            </div>
            <div class="audio-modal-footer">
                <div class="selected-info">Selected: <span id="selectedCountModal">0</span> tracks</div>
                <button class="btn-clear-audio-modal" id="clearAudioModalBtn">Clear</button>
                <button class="btn-apply-audio-modal" id="applyAudioModalBtn">🎵 Apply</button>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBV5xJssncq_IMdUENKxCw4C7wLIEuAvyE",
            authDomain: "ai-video-studio-global.firebaseapp.com",
            projectId: "ai-video-studio-global",
            storageBucket: "ai-video-studio-global.firebasestorage.app",
            messagingSenderId: "62203997603",
            appId: "1:62203997603:web:9ce058c677c9e13e75fe16",
            measurementId: "G-6D2C6T5HHH"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        window.auth = auth;
        window.db = db;
        window.googleProvider = provider;
        window.signInWithPopup = signInWithPopup;
        window.signInWithRedirect = signInWithRedirect;
        window.getRedirectResult = getRedirectResult;
        window.signOut = signOut;
        window.onAuthStateChanged = onAuthStateChanged;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.doc = doc;
        window.getDoc = getDoc;
        window.setDoc = setDoc;
        window.updateDoc = updateDoc;
        window.increment = increment;
        window.collection = collection;
        window.query = query;
        window.where = where;
        window.getDocs = getDocs;
    </script>

    <script src="script.js"></script>
</body>
</html>
