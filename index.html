<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payroll SaaS - Owner</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h2>Payroll SaaS</h2>
            <div class="toggle-tabs">
                <span class="tab active" data-tab="login">Login</span>
                <span class="tab" data-tab="register">Register</span>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <input type="email" id="loginEmail" placeholder="Email" required />
                <input type="password" id="loginPassword" placeholder="Password" required />
                <button type="submit">Login</button>
                <p id="loginError" class="error-msg"></p>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form">
                <input type="text" id="regCompany" placeholder="Company Name" required />
                <input type="email" id="regEmail" placeholder="Email" required />
                <input type="password" id="regPassword" placeholder="Password" minlength="6" required />
                <button type="submit">Register</button>
                <p id="regError" class="error-msg"></p>
            </form>
        </div>
    </div>

    <!-- Universal Modal -->
    <div id="universalModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalTitle">Modal</h3>
            <p id="modalMessage">Message</p>
            <button id="modalBtn">OK</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
