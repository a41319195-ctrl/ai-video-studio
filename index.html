<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Payroll & API Gateway - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h2>Company Payroll Dashboard</h2>
            <p>Data stays 100% local on your system.</p>
        </header>

        <!-- वर्कर जोड़ने का फॉर्म -->
        <section class="form-section">
            <h3>Add / Edit Worker</h3>
            <form id="payroll-form">
                <input type="text" id="worker-name" placeholder="Worker Name" required>
                <input type="text" id="iqama-number" placeholder="Iqama / ID Number" required>
                <input type="text" id="iban-number" placeholder="Bank IBAN" required>
                <input type="number" id="salary-amount" placeholder="Salary Amount (SAR)" required>
                <button type="submit" id="save-btn">Save Worker</button>
            </form>
        </section>

        <!-- वर्कर्स की लिस्ट -->
        <section class="list-section">
            <h3>Workers List</h3>
            <table id="workers-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Iqama / ID</th>
                        <th>IBAN</th>
                        <th>Salary</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="worker-list-body">
                    <!-- JavaScript यहाँ डेटा भरेगा -->
                </tbody>
            </table>
        </section>

        <!-- पेरोल प्रोसेस बटन -->
        <div class="action-section">
            <button id="pay-now-btn" class="pay-btn">Pay Now & Generate API Data</button>
        </div>
    </div>

    <!-- 5000 लिमिट वार्निंग पॉप-अप (Modal) -->
    <div id="warning-modal" class="modal hidden">
        <div class="modal-content">
            <h3>⚠️ High Amount Warning!</h3>
            <p id="warning-text">The following worker's salary exceeds the 5,000 limit. Do you want to confirm this transaction?</p>
            <div class="modal-buttons">
                <button id="confirm-pay-btn" class="btn-danger">Yes, Confirm</button>
                <button id="cancel-pay-btn" class="btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
