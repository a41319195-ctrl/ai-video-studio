<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio - Next-Gen Creator Suite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="studio-container">
        <!-- Top Navigation Bar with Medium Menu Button & Logo Only -->
        <nav class="navbar">
            <button id="menuBtn" class="icon-btn">☰</button>
            <div class="logo">AI Video Studio</div>
            <div></div> <!-- Spacer for balance alignment -->
        </nav>

        <!-- Sidebar Menu -->
        <div id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h3>Menu</h3>
                <button id="closeMenu" class="icon-btn">✕</button>
            </div>
            <ul class="sidebar-links">
                <li><a href="#" class="active">🏠 Studio</a></li>
                <li><a href="admin.html">👑 Admin Account</a></li>
                <li><a href="#" id="buyCoinsMenuLink">💳 Buy Coins ($10+ Pack)</a></li>
                <li><a href="#">📁 My Generated Videos</a></li>
            </ul>
        </div>

        <!-- Header -->
        <header class="studio-header">
            <h1>AI Video Studio</h1>
            <p>Transform text, voice, and images into cinematic masterpieces. (Cost varies by duration)</p>
        </header>

        <!-- Main Workspace -->
        <main class="workspace">
            <!-- Input Section -->
            <section class="input-section">
                <div class="input-group">
                    <label for="prompt">Describe your video or idea:</label>
                    <textarea id="prompt" placeholder="e.g., A cute cat driving a futuristic car through neon streets..."></textarea>
                </div>

                <!-- Media & Voice Controls -->
                <div class="controls-row">
                    <div class="file-upload" style="flex: 1; display: flex;">
                        <label for="imageUpload" class="btn-secondary" style="width: 100%; cursor: pointer; text-align: center;">📁 Upload Image</label>
                        <input type="file" id="imageUpload" accept="image/*" hidden>
                    </div>
                    <button id="micBtn" class="btn-secondary">🎙️ Voice Command</button>
                </div>

                <!-- Options Row -->
                <div class="options-row">
                    <div class="select-group">
                        <label for="resolution">Quality:</label>
                        <select id="resolution">
                            <option value="720p">HD (720p)</option>
                            <option value="1080p" selected>Full HD (1080p)</option>
                            <option value="4k">Ultra HD (4K)</option>
                        </select>
                    </div>
                    <div class="select-group">
                        <label for="videoDuration">Duration / Format:</label>
                        <select id="videoDuration">
                            <option value="30">Shorts / Reel (30 sec) - 5 Coins</option>
                            <option value="120">Standard (1-2 min) - 10 Coins</option>
                            <option value="300" selected>Cinematic (Up to 5 min) - 20 Coins</option>
                        </select>
                    </div>
                </div>

                <button id="generateBtn" class="btn-primary">✨ Generate Video</button>
            </section>

            <!-- Output Preview Section -->
            <section class="preview-section">
                <div class="video-preview-box">
                    <p id="previewText">Your generated video will appear here...</p>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
