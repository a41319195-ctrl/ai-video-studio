<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio - Next-Gen Creator Suite</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* जावास्क्रिप्ट के नए फीचर्स और मोडल के लिए एडिशनल रेस्पॉन्सिव स्टाइल्स */
        .music-studio-box {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 14px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: left;
        }
        .music-studio-box select {
            width: 100%;
            padding: 10px;
            background: #1e293b;
            border: 1px solid #475569;
            color: #f8fafc;
            border-radius: 6px;
            margin-top: 8px;
            margin-bottom: 10px;
            font-size: 13px;
            outline: none;
        }
        .action-btn-success {
            background: #22c55e;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
        }
        .action-btn-success:hover {
            background: #16a34a;
        }
    </style>
</head>
<body>
    <div class="studio-container">
        <!-- Top Navigation Bar with Medium Menu Button & Logo Only -->
        <nav class="navbar">
            <button id="menuBtn" class="icon-btn">☰</button>
            <div class="logo">AI Video Studio</div>
            <!-- Google Sign-In / User Profile Section in Navbar -->
            <div id="authSection" style="display: flex; gap: 8px; align-items: center;">
                <button id="googleLoginBtn" class="btn-primary" style="padding: 6px 12px; font-size: 14px;">🔑 Login with Google</button>
                <div id="userProfile" style="display: none; align-items: center; gap: 8px;">
                    <span id="userName" style="font-size: 13px; font-weight: bold;"></span>
                    <button id="logoutBtn" class="btn-secondary" style="padding: 4px 8px; font-size: 12px;">Logout</button>
                </div>
            </div>
        </nav>

        <!-- Sidebar Menu -->
        <div id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h3>Menu</h3>
                <button id="closeMenu" class="icon-btn">✕</button>
            </div>
            <ul class="sidebar-links">
                <li><a href="#" class="active">🏠 Studio</a></li>
                <li><a href="admin.html">👑 Admin Account</a></li>
                <li><a href="#" id="buyCoinsMenuLink">💳 Buy Coins ($10+ Pack)</a></li>
                <li><a href="#">📁 My Generated Videos</a></li>
            </ul>
        </div>

        <!-- Header -->
        <header class="studio-header">
            <h1>AI Video Studio</h1>
            <p>Transform text, voice, and images into cinematic masterpieces. (Cost varies by duration)</p>
            <!-- Coin Balance Display -->
            <div id="coinBalanceBox" style="margin-top: 10px; font-weight: bold; color: #ffcc00;">
                🪙 Coins: <span id="userCoins">0</span>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="workspace">
            <!-- Input Section -->
            <section class="input-section">
                <div class="input-group">
                    <label for="prompt">Describe your video or idea:</label>
                    <textarea id="prompt" placeholder="e.g., A cute cat driving a futuristic car through neon streets..."></textarea>
                </div>

                <!-- Media & Voice Controls -->
                <div class="controls-row">
                    <div class="file-upload" style="flex: 1; display: flex;">
                        <label for="imageUpload" class="btn-secondary" style="width: 100%; cursor: pointer; text-align: center;">📁 Upload Image</label>
                        <input type="file" id="imageUpload" accept="image/*" hidden>
                    </div>
                    <button id="micBtn" class="btn-secondary">🎙️ Voice Command</button>
                </div>

                <!-- Options Row -->
                <div class="options-row">
                    <div class="select-group">
                        <label for="resolution">Quality:</label>
                        <select id="resolution">
                            <option value="720p">HD (720p)</option>
                            <option value="1080p" selected>Full HD (1080p)</option>
                            <option value="4k">Ultra HD (4K)</option>
                        </select>
                    </div>
                    <div class="select-group">
                        <label for="videoDuration">Duration / Format:</label>
                        <select id="videoDuration">
                            <option value="30">Shorts / Reel (30 sec) - 5 Coins</option>
                            <option value="120">Standard (1-2 min) - 10 Coins</option>
                            <option value="300">Cinematic (5 min) - 20 Coins</option>
                        </select>
                    </div>
                </div>

                <button id="generateBtn" class="btn-primary">✨ Generate Video</button>
            </section>

            <!-- Output Preview Section -->
            <section class="preview-section">
                <div class="video-preview-box" id="previewBox" style="text-align: center;">
                    <p id="previewText">Your generated video will appear here...</p>
                    <!-- यहाँ पर जावास्क्रिप्ट द्वारा वीडियो प्लेयर, 100+ म्यूजिक लाइब्रेरी और डाउनलोड बटन डायनेमिकली लोड हो जाएंगे -->
                </div>
            </section>
        </main>
    </div>

    <!-- Firebase SDKs & Core Configuration Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBV5xJssncq_IMdUENKxCw4C7wLIEuAvyE",
            authDomain: "ai-video-studio-global.firebaseapp.com",
            projectId: "ai-video-studio-global",
            storageBucket: "ai-video-studio-global.firebasestorage.app",
            messagingSenderId: "62203997603",
            appId: "1:62203997603:web:9ce058c677c9e13e75fe16",
            measurementId: "G-6D2C6T5HHH"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // Expose to window for script.js
        window.auth = auth;
        window.db = db;
        window.googleProvider = provider;
        window.signInWithPopup = signInWithPopup;
        window.signInWithRedirect = signInWithRedirect;
        window.getRedirectResult = getRedirectResult;
        window.signOut = signOut;
        window.onAuthStateChanged = onAuthStateChanged;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.doc = doc;
        window.getDoc = getDoc;
        window.setDoc = setDoc;

        console.log("🔥 Firebase Auth & DB Ready with Email/Password & Google Support!");
    </script>

    <script src="script.js"></script>
</body>
</html>
