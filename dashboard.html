<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payroll Dashboard</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="dashboard-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <h2>Payroll Dashboard</h2>
            <div class="top-right">
                <span id="companyDisplay">Company</span>
                <div class="three-dot-menu">
                    <button id="menuToggle">⋮</button>
                    <div id="menuDropdown" class="dropdown-content">
                        <a href="#" id="profileLink">Profile & API</a>
                        <a href="#" id="logoutLink">Logout</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Subscription Lock -->
        <div id="subscriptionLock" class="lock-overlay" style="display:none;">
            <div class="lock-box">
                <h3>Subscription Expired</h3>
                <p>Please renew your subscription to continue.</p>
                <button onclick="showModal('Renew Subscription','Contact admin for renewal.')">OK</button>
            </div>
        </div>

        <!-- Profile & API Modal -->
        <div id="profileModal" class="modal-overlay">
            <div class="modal-box wide">
                <h3>Profile & API</h3>
                <p><strong>Email:</strong> <span id="profEmail"></span></p>
                <p><strong>Password:</strong> <span id="profPass"></span> <button onclick="togglePassView()">👁️</button></p>
                <p><strong>Company:</strong> <span id="profCompany"></span></p>
                <p><strong>API Key:</strong> <span id="profApiKey"></span></p>
                <p><strong>Webhook URL:</strong> <span id="profWebhook"></span></p>
                <button onclick="closeProfileModal()">Close</button>
            </div>
        </div>

        <!-- Worker Form -->
        <div class="worker-form">
            <h3>Add Worker</h3>
            <input type="text" id="workerName" placeholder="Full Name" />
            <input type="text" id="workerId" placeholder="Iqama/ID" />
            <input type="text" id="workerIban" placeholder="IBAN" />
            <input type="number" id="workerSalary" placeholder="Salary (SAR)" step="0.01" />
            <button onclick="addWorker()">Add Worker</button>
        </div>

        <!-- Search & Edit -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search by name or IBAN..." oninput="searchWorker()" />
        </div>

        <!-- Workers Table -->
        <table id="workersTable">
            <thead>
                <tr><th>Name</th><th>ID</th><th>IBAN</th><th>Salary</th><th>Actions</th></tr>
            </thead>
            <tbody></tbody>
        </table>

        <button onclick="submitPayroll()" class="submit-btn">Submit Payroll</button>
    </div>

    <!-- Universal Modal -->
    <div id="universalModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalTitle">Modal</h3>
            <p id="modalMessage">Message</p>
            <button id="modalBtn">OK</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
